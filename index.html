        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        document.getElementById('langBtn').innerText = currentLang.toUpperCase();
        
        const t = translations[currentLang];
        document.getElementById('appTitle').innerText = t.appTitle;

        document.getElementById('catHydro').innerText = t.catHydro;
        document.getElementById('catChem').innerText = t.catChem;
        document.getElementById('catProt').innerText = t.catProt;
        document.getElementById('catOrchard').innerText = t.catOrchard;
        document.getElementById('searchInput').placeholder = t.placeholder;
        document.getElementById('searchBtn').innerText = t.searchBtn;
        document.getElementById('camTitle').innerText = t.camTitle;
        document.getElementById('btnSnap').innerText = t.btnSnap;
        document.getElementById('btnCloseCam').innerText = t.btnCloseCam;

        performSearch(false);
    }

    function levenshteinDistance(a, b) {
        const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
        for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
        for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= a.length; i++) {
            for (let j = 1; j <= b.length; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                matrix[i][j] = Math.min(
                    matrix[i - 1][j] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j - 1] + cost
                );
            }
        }
        return matrix[a.length][b.length];
    }

    function isFuzzyMatch(query, targetText) {
        const q = query.toLowerCase().trim();
        const text = targetText.toLowerCase();

        if (!q) return true;
        if (text.includes(q)) return true;

        const queryWords = q.split(/\s+/);
        const textWords = text.split(/[\s,./\-\(\)]+/);

        return queryWords.some(qWord => {
            if (qWord.length <= 2) return false;
            return textWords.some(tWord => {
                if (Math.abs(qWord.length - tWord.length) > 2) return false;
                const maxDiff = qWord.length <= 4 ? 1 : 2;
                return levenshteinDistance(qWord, tWord) <= maxDiff;
            });
        });
    }

    function isEffectiveOffline() {
        if (manualMode === 'offline') return true;
        if (manualMode === 'online') return false;
        return !navigator.onLine;
    }

    function updateStatusUI() {
        const isOffline = isEffectiveOffline();
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');

        if (isOffline) {
            statusBar.style.backgroundColor = '#fff3e0';
            statusBar.style.color = '#e65100';
            statusText.innerText = currentLang === 'ru' ? '⚡ Источник: Офлайн-база знаний' : '⚡ Source: Offline Knowledge Base';
        } else {
            statusBar.style.backgroundColor = '#e0f2f1';
            statusBar.style.color = '#00695c';
            statusText.innerText = currentLang === 'ru' ? '🌐 Источник данных: Онлайн-сервер ИИ-Консультант' : '🌐 Source: Online AI Expert Server';
        }

        document.getElementById('modeAuto').classList.toggle('active', manualMode === 'auto');
        document.getElementById('modeOffline').classList.toggle('active', manualMode === 'offline');
        document.getElementById('modeOnline').classList.toggle('active', manualMode === 'online');
    }

    function toggleModeManual() {
        if (manualMode === 'auto') manualMode = 'offline';
        else if (manualMode === 'offline') manualMode = 'online';
        else manualMode = 'auto';
        
        updateStatusUI();
        performSearch(false);
    }

    function selectCategory(element, catKey) {
        document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedCategoryFilter = catKey;
        performSearch(false);
    }

    async function performSearch(autoSpeak = false) {
        const query = document.getElementById('searchInput').value;
        let data = [];

        if (isEffectiveOffline()) {
            data = localDatabase.filter(item => {
                const title = currentLang === 'ru' ? item.title : item.title_en;
                const content = currentLang === 'ru' ? item.content : item.content_en;
                const matchesCat = !selectedCategoryFilter || item.catKey === selectedCategoryFilter;
                
                return matchesCat && (isFuzzyMatch(query, title) || isFuzzyMatch(query, content));
            });
        } else {
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&lang=${currentLang}`);
                data = await response.json();
                
                if (!data || data.length === 0) {
                    data = localDatabase.filter(item => isFuzzyMatch(query, item.title));
                }
            } catch (err) {
                data = localDatabase.filter(item => isFuzzyMatch(query, item.title));
            }
        }

        renderResults(data, autoSpeak);
    }

    function renderResults(data, autoSpeak) {
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';
        const t = translations[currentLang];

        if (data.length === 0) {
            container.innerHTML = `<p style="color: #777;">${t.noResults}</p>`;
            if (autoSpeak) speakText(t.noResults);
            return;
        }

        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';

            const displayTitle = currentLang === 'ru' ? item.title : (item.title_en || item.title);
            const displayCategory = currentLang === 'ru' ? item.category : (item.category_en || item.category);
            const displayContent = currentLang === 'ru' ? item.content : (item.content_en || item.content);

            const cleanTitle = displayTitle.replace(/'/g, "\\'");
            const cleanContent = displayContent.replace(/'/g, "\\'").replace(/\n/g, ' ');

            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <h3>${displayTitle}</h3>
                        <span class="tag">${displayCategory}</span>
                    </div>
                    <button class="btn-speak" onclick="toggleSpeakText('${cleanTitle}. ${cleanContent}', this)">${t.speakBtn}</button>
                </div>
                <p style="white-space: pre-line; margin-top: 15px;">${displayContent}</p>
                ${item.dosage ? `<div class="dosage-box"><strong>${t.dosageTitle}</strong>${item.dosage}</div>` : ''}
            `;
            container.appendChild(card);

            if (autoSpeak && index === 0) {
                toggleSpeakText(`${displayTitle}. ${displayContent}`, card.querySelector('.btn-speak'));
            }
        });
    }

    // 🔊 Озвучка с кнопкой Стоп/Пауза
    let activeSpeakBtn = null;

    function toggleSpeakText(text, btnElement) {
        const t = translations[currentLang];

        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            resetSpeakButtons();
            if (activeSpeakBtn === btnElement) {
                activeSpeakBtn = null;
                return;
            }
        }

        resetSpeakButtons();
        activeSpeakBtn = btnElement;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        utterance.pitch = 1.0;

        const targetLang = currentLang === 'ru' ? 'ru' : 'en';
        utterance.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';

        const voices = window.speechSynthesis.getVoices();

        if (voices.length > 0) {
            let selectedVoice = voices.find(v => 
                v.lang.includes(targetLang) && 
                (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Dmitry') || v.name.includes('Pavel') || v.name.includes('Microsoft'))
            );

            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.startsWith(targetLang));
            }

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
        }

        utterance.onstart = () => {
            if (btnElement) {
                btnElement.innerText = t.stopBtn;
                btnElement.style.backgroundColor = "#ffebee";
                btnElement.style.color = "#c62828";
            }
        };

        utterance.onend = () => {
            resetSpeakButtons();
            activeSpeakBtn = null;
        };

        utterance.onerror = () => {
            resetSpeakButtons();
            activeSpeakBtn = null;
        };

        window.speechSynthesis.speak(utterance);
    }

    function resetSpeakButtons() {
        const t = translations[currentLang];
        document.querySelectorAll('.btn-speak').forEach(btn => {
            btn.innerText = t.speakBtn;
            btn.style.backgroundColor = "#f0f4f8";
            btn.style.color = "#333";
        });
    }

    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // 🎤 Микрофон
    function startVoiceRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Голосовой ввод не поддерживается вашим браузером.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
        recognition.interimResults = false;

        const micBtn = document.getElementById('micBtn');
        micBtn.classList.add('listening');

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('searchInput').value = transcript;
            micBtn.classList.remove('listening');
            performSearch(true);
        };

        recognition.onerror = () => micBtn.classList.remove('listening');
        recognition.onend = () => micBtn.classList.remove('listening');

        recognition.start();
    }

    // 🎧 Bluetooth Hands-Free
    function toggleHandsFree() {
        isHandsFreeActive = !isHandsFreeActive;
        const btn = document.getElementById('handsFreeBtn');
        const t = translations[currentLang];

        if (isHandsFreeActive) {
            btn.classList.add('active');
            toggleSpeakText(t.hfActive, null);
            setTimeout(listenHandsFreeLoop, 3000);
        } else {
            btn.classList.remove('active');
            window.speechSynthesis.cancel();
            resetSpeakButtons();
            toggleSpeakText(t.hfInactive, null);
        }
    }

    function listenHandsFreeLoop() {
        if (!isHandsFreeActive) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        const recognition = new SpeechRecognition();
        recognition.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('searchInput').value = transcript;
            performSearch(true);
        };

        recognition.onend = () => {
            if (isHandsFreeActive) setTimeout(listenHandsFreeLoop, 1500);
        };

        recognition.start();
    }

    // 📷 Камера
    async function openCameraModal() {
        const modal = document.getElementById('cameraModal');
        const video = document.getElementById('videoFeed');
        
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }

        modal.style.display = 'flex';

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert(currentLang === 'ru' 
                ? "Запуск камеры заблокирован браузером." 
                : "Camera access blocked.");
            closeCameraModal();
            return;
        }

        try {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            } catch (fallbackErr) {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            video.srcObject = cameraStream;
        } catch (err) {
            console.error("Camera error:", err);
            alert((currentLang === 'ru' ? "Ошибка доступа к камере: " : "Camera error: ") + err.message);
            closeCameraModal();
        }
    }

    function closeCameraModal() {
        const modal = document.getElementById('cameraModal');
        modal.style.display = 'none';
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
    }

    function captureAndScan() {
        alert(currentLang === 'ru' ? "Снимок получен. Выполняется анализ образца..." : "Image captured. Analyzing sample...");
        closeCameraModal();
        document.getElementById('searchInput').value = "Фисташка";
        performSearch(true);
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
    }

    updateStatusUI();
    performSearch(false);
</script>
